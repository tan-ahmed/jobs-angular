<section id="employers" class="border-y border-border bg-card">
  <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 sm:py-14 lg:px-8">
    <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between sm:gap-6">
      <div class="max-w-xl">
        <h2 class="font-serif text-2xl font-semibold tracking-tight text-balance sm:text-3xl">
          Trusted by the world's leading institutions
        </h2>
      </div>
      <a
        href="#employers"
        class="inline-flex shrink-0 items-center gap-2 self-start text-sm font-semibold text-primary underline-offset-4 hover:underline sm:self-auto"
      >
        Browse all employers
        <ng-icon name="lucideArrowRight" class="size-4" />
      </a>
    </div>

    <ul
      class="mt-8 grid grid-cols-1 gap-px overflow-hidden rounded-xl border border-border bg-border sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"
    >
      @for (name of employers; track name) {
        <li
          class="flex items-center gap-3 bg-card px-4 py-4 text-sm font-medium text-foreground/80 sm:px-5 sm:py-5"
        >
          <span
            class="flex size-9 shrink-0 items-center justify-center rounded-lg bg-secondary text-primary"
          >
            <ng-icon name="lucideBuilding2" class="size-4" />
          </span>
          <span class="leading-tight text-pretty">{{ name }}</span>
        </li>
      }
    </ul>
  </div>
</section>
