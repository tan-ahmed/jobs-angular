<header class="sticky top-0 z-50 border-b border-border/70 bg-card/90 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="flex shrink-0 items-center" aria-label="jobs.ac.uk home">
      <img
        ngSrc="/images/jobsacuk-logo.png"
        alt="jobs.ac.uk"
        width="148"
        height="40"
        priority
        class="h-9 w-auto"
      />
    </a>

    <nav class="hidden items-center gap-7 lg:flex" aria-label="Primary">
      @for (item of navItems; track item.label) {
        @if (item.kind === 'route') {
          <a
            [routerLink]="item.link"
            routerLinkActive="text-primary"
            [routerLinkActiveOptions]="{ exact: item.link === '/' }"
            class="text-sm font-medium text-foreground/75 transition-colors hover:text-primary"
          >
            {{ item.label }}
          </a>
        } @else {
          <a
            [href]="item.link"
            class="text-sm font-medium text-foreground/75 transition-colors hover:text-primary"
          >
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <div class="hidden items-center gap-3 lg:flex">
      <button z-button zType="ghost" zSize="sm" type="button" class="gap-2 text-brand">
        <ng-icon name="lucideUserRound" />
        Your Account
      </button>
      <span class="h-6 w-px bg-border" aria-hidden="true"></span>
      <button z-button zSize="sm" type="button">Recruiters</button>
    </div>

    <button
      type="button"
      class="inline-flex size-10 items-center justify-center rounded-md text-brand lg:hidden"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-controls]="'mobile-nav'"
      (click)="toggleMenu()"
    >
      @if (menuOpen()) {
        <ng-icon name="lucideX" size="20" />
      } @else {
        <ng-icon name="lucideMenu" size="20" />
      }
    </button>
  </div>
</header>

@if (menuOpen()) {
  <div
    id="mobile-nav"
    class="fixed inset-0 z-[100] flex flex-col bg-card lg:hidden"
    role="dialog"
    aria-modal="true"
    aria-label="Mobile navigation"
  >
    <div class="flex h-16 shrink-0 items-center justify-between gap-4 border-b border-border px-4 sm:px-6">
      <a
        routerLink="/"
        class="flex shrink-0 items-center"
        aria-label="jobs.ac.uk home"
        (click)="closeMenu()"
      >
        <img
          ngSrc="/images/jobsacuk-logo.png"
          alt="jobs.ac.uk"
          width="148"
          height="40"
          class="h-9 w-auto"
        />
      </a>
      <button
        type="button"
        class="inline-flex size-10 items-center justify-center rounded-md text-brand"
        aria-label="Close menu"
        (click)="closeMenu()"
      >
        <ng-icon name="lucideX" size="20" />
      </button>
    </div>

    <nav class="flex flex-1 flex-col overflow-y-auto px-4 py-4 sm:px-6" aria-label="Mobile">
      <ul class="flex flex-col">
        @for (item of navItems; track item.label) {
          <li class="border-b border-border">
            @if (item.kind === 'route') {
              <a
                [routerLink]="item.link"
                class="block py-4 text-lg font-medium text-foreground transition-colors hover:text-primary"
                (click)="closeMenu()"
              >
                {{ item.label }}
              </a>
            } @else {
              <a
                [href]="item.link"
                class="block py-4 text-lg font-medium text-foreground transition-colors hover:text-primary"
                (click)="closeMenu()"
              >
                {{ item.label }}
              </a>
            }
          </li>
        }
      </ul>

      <div class="mt-auto flex flex-col gap-3 pt-8 pb-6">
        <button z-button zType="outline" type="button" class="w-full gap-2">
          <ng-icon name="lucideUserRound" />
          Your Account
        </button>
        <button z-button type="button" class="w-full">Recruiters</button>
      </div>
    </nav>
  </div>
}
