<header class="sticky top-0 z-50 border-b border-border/70 bg-card/90 backdrop-blur-md">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <a routerLink="/" class="flex shrink-0 items-center" aria-label="jobs.ac.uk home">
      <img
        ngSrc="/images/jobsacuk-logo.png"
        alt="jobs.ac.uk"
        width="148"
        height="40"
        priority
        class="h-9 w-auto"
      />
    </a>

    <nav class="hidden items-center gap-7 lg:flex" aria-label="Primary">
      @for (item of navItems; track item.label) {
        @if (item.kind === 'route') {
          <a
            [routerLink]="item.link"
            routerLinkActive="text-primary"
            [routerLinkActiveOptions]="{ exact: item.link === '/' }"
            class="text-sm font-medium text-foreground/75 transition-colors hover:text-primary"
          >
            {{ item.label }}
          </a>
        } @else {
          <a
            [href]="item.link"
            class="text-sm font-medium text-foreground/75 transition-colors hover:text-primary"
          >
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <div class="hidden items-center gap-3 lg:flex">
      <button z-button zType="ghost" zSize="sm" type="button" class="gap-2 text-brand">
        <ng-icon name="lucideUserRound" />
        Your Account
      </button>
      <span class="h-6 w-px bg-border" aria-hidden="true"></span>
      <button z-button zSize="sm" type="button">Recruiters</button>
    </div>

    <button
      type="button"
      class="inline-flex size-10 items-center justify-center rounded-md text-brand lg:hidden"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      @if (menuOpen()) {
        <ng-icon name="lucideX" size="20" />
      } @else {
        <ng-icon name="lucideMenu" size="20" />
      }
    </button>
  </div>

  @if (menuOpen()) {
    <div class="border-t border-border/70 bg-background lg:hidden">
      <nav class="mx-auto flex max-w-7xl flex-col px-4 py-2 sm:px-6" aria-label="Mobile">
        @for (item of navItems; track item.label) {
          @if (item.kind === 'route') {
            <a
              [routerLink]="item.link"
              class="border-b border-border/60 py-3 text-sm font-medium text-foreground/80 last:border-0"
              (click)="closeMenu()"
            >
              {{ item.label }}
            </a>
          } @else {
            <a
              [href]="item.link"
              class="border-b border-border/60 py-3 text-sm font-medium text-foreground/80 last:border-0"
              (click)="closeMenu()"
            >
              {{ item.label }}
            </a>
          }
        }
        <div class="flex gap-2 py-3">
          <button z-button zType="outline" type="button" class="flex-1 gap-2">
            <ng-icon name="lucideUserRound" />
            Your Account
          </button>
          <button z-button type="button" class="flex-1">Recruiters</button>
        </div>
      </nav>
    </div>
  }
</header>
